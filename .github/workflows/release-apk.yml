name: Build Unsigned Studio APK for Local Signing

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Android versionCode (must increase for every update)
        required: true
        default: "10001"
      version_name:
        description: Android versionName
        required: true
        default: "1.0-studio"

jobs:
  release:
    if: github.ref == 'refs/heads/feature/scene-planner-first-release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Validate backend and catalog
        working-directory: backend
        run: node ../scripts/run-ci-check.mjs backend-check -- npm run check

      - name: Validate Android WebView JavaScript syntax
        run: find app/src/main/assets -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate Project 5 safety
        working-directory: backend
        run: node ../scripts/run-ci-check.mjs project5-safety -- npm run test:project5-safety && node ../scripts/run-ci-check.mjs project5-base -- npm run test:project5-base && node ../scripts/run-ci-check.mjs project52-release -- npm run test:project52-release

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Validate public version inputs
        shell: bash
        env:
          STUDIO_VERSION_CODE: ${{ inputs.version_code }}
          STUDIO_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          [[ "$STUDIO_VERSION_CODE" =~ ^[1-9][0-9]{0,9}$ ]]
          test "$STUDIO_VERSION_CODE" -le 2100000000
          [[ "$STUDIO_VERSION_NAME" =~ ^[A-Za-z0-9._-]{1,40}$ ]]

      - name: Run Android unit tests
        run: gradle testDebugUnitTest testStudioUnitTest

      - name: Studio Android lint
        run: gradle lintStudio

      - name: Build unsigned Studio release APK
        env:
          STUDIO_VERSION_CODE: ${{ inputs.version_code }}
          STUDIO_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          gradle assembleStudio "-PreleaseVersionCode=$STUDIO_VERSION_CODE" "-PreleaseVersionName=$STUDIO_VERSION_NAME"

      - name: Verify release APK
        shell: bash
        env:
          STUDIO_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/studio/app-studio-unsigned.apk'
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -s "$APK"
          "$TOOLS/aapt" dump badging "$APK" > app/build/studio-badging.txt
          head -n 1 app/build/studio-badging.txt > app/build/studio-identity.txt
          grep -Fq "name='com.lightingai.app.studio'" app/build/studio-identity.txt
          grep -Fq "versionCode='$STUDIO_VERSION_CODE'" app/build/studio-identity.txt
          grep -Fq "application-label:'LightingAI Studio'" app/build/studio-badging.txt
          if grep -Fq 'application-debuggable' app/build/studio-badging.txt; then exit 1; fi
          if "$TOOLS/apksigner" verify "$APK" > /dev/null 2>&1; then exit 1; fi
          for asset in scene-planner.js scene-planner-core.js scene-planner-draft.js; do
            unzip -p "$APK" "assets/$asset" > "app/build/studio-$asset"
            cmp "app/build/studio-$asset" "app/src/main/assets/$asset"
          done
          cp "$APK" "app/build/outputs/apk/studio/LightingAI-Studio-UNSIGNED-$STUDIO_VERSION_CODE.apk"

      - name: Upload unsigned Studio APK
        uses: actions/upload-artifact@v7
        with:
          name: LightingAI-Studio-UNSIGNED-${{ inputs.version_code }}.apk
          path: app/build/outputs/apk/studio/LightingAI-Studio-UNSIGNED-${{ inputs.version_code }}.apk
          archive: false
          retention-days: 30

      - name: Collect available sanitized CI reports
        if: ${{ always() }}
        env:
          CI_HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci-report-summary.mjs

      - name: Upload sanitized CI reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: release-ci-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-safe-reports/summary.json
          if-no-files-found: warn
          retention-days: 14
