plugins { id 'com.android.application' }

def releaseVersionCode = (project.findProperty('releaseVersionCode') ?: '1') as Integer
def releaseVersionName = String.valueOf(project.findProperty('releaseVersionName') ?: 'Probe')
def probeAppLabel = String.valueOf(project.findProperty('probeAppLabel') ?: 'Light AI Proba')
def releaseStoreFile = System.getenv('LIGHTINGAI_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('LIGHTINGAI_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('LIGHTINGAI_KEY_ALIAS')
def releaseKeyPassword = System.getenv('LIGHTINGAI_KEY_PASSWORD')
def hasReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it != null && !it.trim().isEmpty() }

android { namespace 'com.lightingai.app'; compileSdk 35
    defaultConfig {
        applicationId 'com.lightingai.probe'
        minSdk 26
        targetSdk 35
        versionCode releaseVersionCode
        versionName releaseVersionName
        resValue 'string', 'app_name', probeAppLabel
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }
}


dependencies {
    testImplementation 'junit:junit:4.13.2'
}
