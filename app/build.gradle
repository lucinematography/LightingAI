plugins { id 'com.android.application' }

def releaseVersionCode = (project.findProperty('releaseVersionCode') ?: '13') as Integer
def releaseVersionName = String.valueOf(project.findProperty('releaseVersionName') ?: '2.1')
def releaseStoreFile = System.getenv('LIGHTINGAI_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('LIGHTINGAI_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('LIGHTINGAI_KEY_ALIAS')
def releaseKeyPassword = System.getenv('LIGHTINGAI_KEY_PASSWORD')
def hasReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it != null && !it.trim().isEmpty() }
// CI supplies this dedicated TEST-ONLY keystore. Never ship this signing identity as a release.
def labTestKeystore = System.getenv('LIGHTINGAI_LAB_DEBUG_KEYSTORE_PATH')
def hasLabTestSigning = labTestKeystore != null && !labTestKeystore.trim().isEmpty()

android { namespace 'com.lightingai.app'; compileSdk 35
    defaultConfig {
        applicationId 'com.lightingai.app'
        minSdk 26
        targetSdk 35
        versionCode releaseVersionCode
        versionName releaseVersionName
    }

    signingConfigs {
        if (hasLabTestSigning) {
            labTest {
                storeFile file(labTestKeystore)
                storePassword 'android'
                keyAlias 'lightingai-control-lab'
                keyPassword 'android'
            }
        }
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            // Keep the LAB package identity fixed across monotonically increasing versionCodes.
            applicationIdSuffix '.control13'
            versionNameSuffix '-control-lab'
            if (hasLabTestSigning) signingConfig signingConfigs.labTest
        }
        release {
            minifyEnabled false
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }
}


dependencies {
    testImplementation 'junit:junit:4.13.2'
}
