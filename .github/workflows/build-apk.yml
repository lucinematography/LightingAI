name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "feature/ai-visual-scene-plan" ]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Embed Project 5 build identity
        if: github.ref == 'refs/heads/feature/ai-visual-scene-plan'
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          BUILT_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          printf 'window.LightingAIFeatureBuild={run:"%s",sha:"%s",branch:"%s",builtAt:"%s"};\n' "$GITHUB_RUN_NUMBER" "$SHORT_SHA" "$GITHUB_REF_NAME" "$BUILT_AT" > app/src/main/assets/feature-build-info.js

      - name: Validate complete LightingAI equipment catalog
        working-directory: backend
        run: npm run check

      - name: Validate Android WebView JavaScript syntax
        run: find app/src/main/assets -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate Project 5 feature safety invariants
        if: github.ref == 'refs/heads/feature/ai-visual-scene-plan'
        working-directory: backend
        run: npm run test:project5-safety

      - name: Validate Project 5 stable build 510 base
        if: github.ref == 'refs/heads/feature/ai-visual-scene-plan'
        working-directory: backend
        run: npm run test:project5-base

      - name: Validate Project Backup data and exclusions
        run: node backend/project-backup-selftest.js

      - name: Probe isolated AI preview backend
        if: github.ref == 'refs/heads/feature/ai-visual-scene-plan'
        continue-on-error: true
        run: |
          echo '--- isolated preview status ---'
          curl --fail-with-body --silent --show-error --max-time 20 https://lightingai-ai-preview-test.onrender.com/api/visual-preview || true
          echo
          echo '--- end preview status ---'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Verify packaged Project 5 APK
        if: github.ref == 'refs/heads/feature/ai-visual-scene-plan'
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          SHORT_SHA="${GITHUB_SHA:0:7}"
          REQUIRED=(
            'assets/ai-visual-scene-launcher.js'
            'assets/ai-visual-scene-plan.js'
            'assets/ai-visual-local-simulation.js'
            'assets/ai-visual-result-polish.js'
            'assets/ai-visual-phone-diagnostics.js'
            'assets/ai-visual-phone-test.js'
            'assets/ai-visual-equipment-home.js'
            'assets/feature-build-info.js'
            'assets/catalog.js'
          )

          test -s "$APK"
          for asset in "${REQUIRED[@]}"; do
            unzip -Z1 "$APK" | grep -Fxq "$asset" || { echo "Missing packaged asset: $asset"; exit 1; }
            cmp -s <(unzip -p "$APK" "$asset") "app/src/main/$asset" || { echo "Packaged asset differs from source: $asset"; exit 1; }
          done

          INFO="$(unzip -p "$APK" assets/feature-build-info.js)"
          grep -Fq "run:\"$GITHUB_RUN_NUMBER\"" <<<"$INFO" || { echo 'Packaged build number mismatch'; exit 1; }
          grep -Fq "sha:\"$SHORT_SHA\"" <<<"$INFO" || { echo 'Packaged commit SHA mismatch'; exit 1; }

          CATALOG="$(unzip -p "$APK" assets/catalog.js)"
          test "$(grep -oF 'file:///android_asset/ai-visual-scene-launcher.js' <<<"$CATALOG" | wc -l)" -eq 1 || { echo 'Packaged catalog launcher count is not exactly one'; exit 1; }

          for asset in "${REQUIRED[@]}"; do
            if unzip -p "$APK" "$asset" | grep -aEq 'sk-[A-Za-z0-9_-]{20,}'; then
              echo "Potential OpenAI API secret found inside packaged asset: $asset"
              exit 1
            fi
          done

          echo "Packaged Project 5 APK verified: BUILD $GITHUB_RUN_NUMBER / $SHORT_SHA"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LightingAI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
