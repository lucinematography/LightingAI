name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main", "feature/**", "fix/**", "chore/**" ]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    concurrency:
      group: lightingai-android-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Audit backend dependencies for high/critical vulnerabilities
        working-directory: backend
        run: npm run audit:dependencies

      - name: Embed Project 5 build identity
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          BUILT_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          printf 'window.LightingAIFeatureBuild={run:"%s",sha:"%s",branch:"%s",builtAt:"%s"};\n' "$GITHUB_RUN_NUMBER" "$SHORT_SHA" "$GITHUB_REF_NAME" "$BUILT_AT" > app/src/main/assets/feature-build-info.js

      - name: Build official FILTERI GEL catalog
        working-directory: backend
        run: npm run build:gels

      - name: Validate complete LightingAI equipment catalog
        working-directory: backend
        run: npm run check

      - name: Validate Android WebView JavaScript syntax
        run: find app/src/main/assets -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Guard Project 5 Equipment layout
        shell: bash
        run: |
          set -euo pipefail
          FILE='app/src/main/assets/ai-visual-scene-launcher.js'
          grep -Fq "document.getElementById('equipment')" "$FILE" || { echo 'AI visual plan is no longer anchored to Equipment page'; exit 1; }
          grep -Fq "document.getElementById('powerCalculatorCard')" "$FILE" || { echo 'Power calculator compact target missing'; exit 1; }
          grep -Fq "body.hidden=true" "$FILE" || { echo 'Power calculator must default to collapsed'; exit 1; }
          grep -Fq "version:'1.0-equipment-home-safe'" "$FILE" || { echo 'Safe Equipment layout version marker missing'; exit 1; }
          if grep -Fq 'MutationObserver' "$FILE"; then echo 'Global DOM observer is forbidden after build 558 regression'; exit 1; fi
          if grep -Fq 'position:fixed' "$FILE"; then echo 'Floating AI launcher is forbidden; AI plan belongs on Equipment page'; exit 1; fi
          if grep -Fq 'data-page' "$FILE"; then echo 'Project 5 launcher must not modify page navigation'; exit 1; fi
          echo 'Project 5 Equipment layout guard passed'

      - name: Validate Project 5 feature safety invariants
        working-directory: backend
        run: npm run test:project5-safety

      - name: Validate Project 5 stable build 510 base
        working-directory: backend
        run: npm run test:project5-base

      - name: Validate Project 5.2 release gate
        working-directory: backend
        run: npm run test:project52-release

      - name: Validate Project Backup data and exclusions
        run: node backend/project-backup-selftest.js

      - name: Validate Blocking Camera Designer integration
        working-directory: backend
        run: npm run test:blocking-designer

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Restore stable review signing key
        id: review-signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.lightingai-review/lightingai-review.p12
          key: lightingai-review-signing-v1
          # Keep this cache key stable so review APKs remain in-place updatable on test phones.

      - name: Prepare stable review signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.lightingai-review"
          KEYSTORE="$HOME/.lightingai-review/lightingai-review.p12"
          if [ ! -s "$KEYSTORE" ]; then
            keytool -genkeypair -noprompt \
              -storetype PKCS12 \
              -keystore "$KEYSTORE" \
              -storepass lightingai-review \
              -alias lightingai-review \
              -keypass lightingai-review \
              -keyalg RSA \
              -keysize 3072 \
              -validity 10000 \
              -dname "CN=LightingAI Review,O=LightingAI,C=RS"
          fi
          keytool -list -keystore "$KEYSTORE" -storepass lightingai-review -alias lightingai-review >/dev/null
          echo "LIGHTINGAI_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "LIGHTINGAI_KEYSTORE_PASSWORD=lightingai-review" >> "$GITHUB_ENV"
          echo "LIGHTINGAI_KEY_ALIAS=lightingai-review" >> "$GITHUB_ENV"
          echo "LIGHTINGAI_KEY_PASSWORD=lightingai-review" >> "$GITHUB_ENV"
          keytool -list -v -keystore "$KEYSTORE" -storepass lightingai-review -alias lightingai-review | grep 'SHA256:'
          echo "Stable review signing key ready"


      - name: Collect Android lint report
        continue-on-error: true
        run: gradle lintDebug

      - name: Enforce Android lint on changed app files
        working-directory: backend
        run: node android-lint-changed-files-gate.js

      - name: Android unit tests
        run: gradle testDebugUnitTest

      - name: Build stable-signed review APK
        run: |
          test -s "$LIGHTINGAI_KEYSTORE_PATH"
          gradle assembleDebug \
            -PreleaseVersionCode=${GITHUB_RUN_NUMBER} \
            -PreleaseVersionName=2.1.${GITHUB_RUN_NUMBER}

      - name: Verify packaged Project 5 APK
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          SHORT_SHA="${GITHUB_SHA:0:7}"
          REQUIRED=(
            'assets/ai-visual-scene-launcher.js'
            'assets/ai-visual-scene-plan.js'
            'assets/ai-visual-local-simulation.js'
            'assets/ai-visual-result-polish.js'
            'assets/ai-visual-image-actions.js'
            'assets/ai-visual-preview-refinements.js'
            'assets/ai-visual-phone-diagnostics.js'
            'assets/ai-visual-phone-test.js'
            'assets/feature-build-info.js'
            'assets/catalog.js'
            'assets/gel-filter-catalog.js'
            'assets/gel-filter-ui.js'
            'assets/simple-mode-ui.js'
            'assets/tools-compact-ui.js'
            'assets/set-sketch.js'
            'assets/set-sketch-camera-fov.js'
            'assets/blocking-camera-designer.js'
            'assets/set-sketch-sun.js'
            'assets/blocking-sun-integration.js'
            'assets/blocking-ai-integration.js'
            'assets/shot-list-planner.js'
            'assets/shot-setup-report.js'
            'assets/shot-setup-recovery.js'
            'assets/camera-setup-snapshots.js'
          )

          test -s "$APK"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT" || { echo 'Android SDK root missing'; exit 1; }
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          test -x "$APKSIGNER" || { echo 'apksigner missing'; exit 1; }
          "$APKSIGNER" verify --verbose "$APK"
          "$APKSIGNER" verify --print-certs "$APK"
          echo "Stable review APK signature verified"
          for asset in "${REQUIRED[@]}"; do
            unzip -Z1 "$APK" | grep -Fxq "$asset" || { echo "Missing packaged asset: $asset"; exit 1; }
            cmp -s <(unzip -p "$APK" "$asset") "app/src/main/$asset" || { echo "Packaged asset differs from source: $asset"; exit 1; }
          done

          INFO="$(unzip -p "$APK" assets/feature-build-info.js)"
          grep -Fq "run:\"$GITHUB_RUN_NUMBER\"" <<<"$INFO" || { echo 'Packaged build number mismatch'; exit 1; }
          grep -Fq "sha:\"$SHORT_SHA\"" <<<"$INFO" || { echo 'Packaged commit SHA mismatch'; exit 1; }

          CATALOG="$(unzip -p "$APK" assets/catalog.js)"
          test "$(grep -oF 'file:///android_asset/ai-visual-scene-launcher.js' <<<"$CATALOG" | wc -l)" -eq 1 || { echo 'Packaged catalog launcher count is not exactly one'; exit 1; }

          for asset in "${REQUIRED[@]}"; do
            if unzip -p "$APK" "$asset" | grep -aEq 'sk-[A-Za-z0-9_-]{20,}'; then
              echo "Potential OpenAI API secret found inside packaged asset: $asset"
              exit 1
            fi
          done

          echo "Packaged Project 5 APK verified: BUILD $GITHUB_RUN_NUMBER / $SHORT_SHA"

      - name: Prepare direct APK artifact
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/LightingAI-build-${GITHUB_RUN_NUMBER}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/debug/LightingAI-build-${{ github.run_number }}.apk
          archive: false
          retention-days: 14
