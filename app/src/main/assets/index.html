<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f12">
<title>LIGHTING AI</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#0d0f12;color:#f4f4f5;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.app{min-height:100vh;padding-bottom:84px}header{position:sticky;top:0;z-index:10;padding:16px;background:#0d0f12ee;border-bottom:1px solid #23272d}.logo{font-weight:900;letter-spacing:.08em}.logo span{color:#f5c542}.sub{font-size:11px;color:#8f96a0;margin-top:3px}.langbar{display:flex;gap:8px;margin-top:10px}.langbtn{border:1px solid #30343b;background:#15181d;color:#c7ccd3;border-radius:9px;padding:7px 10px;font-weight:700}.langbtn.active{background:#f5c542;color:#111}main{max-width:800px;margin:auto;padding:14px}.page{display:none}.page.active{display:block}h1{font-size:24px;margin:8px 0 14px}h2{font-size:18px}.card{background:#15181d;border:1px solid #282c32;border-radius:16px;padding:16px;margin-bottom:13px}.muted{color:#9299a3}.small{font-size:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}label.caption{display:block;color:#9da3ad;font-size:11px;margin:12px 0 6px}input,select,textarea{width:100%;background:#0f1115;border:1px solid #30343b;color:#fff;border-radius:11px;padding:12px;font:inherit}textarea{min-height:110px}.btn{border:0;border-radius:11px;padding:12px 14px;font-weight:800;font-size:13px}.primary{background:#f5c542;color:#121212}.secondary{background:#252a31;color:#fff}.danger{background:#382124;color:#ffb5b5}.actions,.photoActions{display:flex;gap:8px;margin-top:12px}.actions .btn,.photoActions .btn{flex:1}.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}.chip{display:flex;align-items:center;gap:7px;padding:10px;background:#0f1115;border:1px solid #30343b;border-radius:11px;font-size:12px}.chip input{width:auto}.status{padding:10px 12px;border-radius:11px;margin-bottom:12px;font-size:12px}.ok{background:#163025;color:#b8f0d1}.warn{background:#342e18;color:#f5dd91}.photoPreview{width:100%;max-height:320px;object-fit:cover;border-radius:12px;border:1px solid #30343b;margin-top:10px;display:none}.item{padding:12px 0;border-bottom:1px solid #292d33}.item:last-child{border-bottom:0}.itemtop{display:flex;justify-content:space-between;gap:10px}.empty{text-align:center;padding:30px 10px;color:#858c95}.planTitle{color:#f5c542}.planText{white-space:pre-wrap;line-height:1.5}.fab{position:fixed;right:18px;bottom:92px;border:0;border-radius:50%;width:54px;height:54px;background:#f5c542;color:#111;font-size:27px}nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#111318;border-top:1px solid #25282d;display:grid;grid-template-columns:repeat(4,1fr);padding:7px 5px calc(7px + env(safe-area-inset-bottom))}nav button{border:0;background:transparent;color:#858c95;font-size:10px;padding:7px 2px}nav button.active{color:#f5c542}.icon{font-size:19px;display:block;margin-bottom:2px}@media(max-width:520px){.row{grid-template-columns:1fr}.chips{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">LIGHTING <span>AI</span></div><div class="sub" id="subtitle"></div><div class="langbar"><button id="langSr" class="langbtn" onclick="setLanguage('sr')">🇷🇸 SR</button><button id="langEn" class="langbtn" onclick="setLanguage('en')">🇬🇧 EN</button></div></header>
<main>
<section id="planner" class="page active"><h1 id="plannerTitle"></h1><div id="apiStatus"></div><div class="card">
<div class="row"><div><label class="caption" id="lblProject"></label><input id="projectName"></div><div><label class="caption" id="lblScene"></label><input id="sceneName"></div></div>
<div class="row"><div><label class="caption" id="lblType"></label><select id="type"></select></div><div><label class="caption" id="lblLook"></label><select id="look"></select></div></div>
<div class="row"><div><label class="caption" id="lblSpace"></label><input id="space" value="6 × 5 × 3 m"></div><div><label class="caption" id="lblCamera"></label><input id="camera" value="ARRI Alexa 35"></div></div>
<label class="caption" id="lblDescription"></label><textarea id="description"></textarea>
<label class="caption" id="lblPhoto"></label><input id="galleryInput" type="file" accept="image/*" style="display:none" onchange="handlePhoto(event)"><input id="cameraInput" type="file" accept="image/*" capture="environment" style="display:none" onchange="handlePhoto(event)"><div class="photoActions"><button class="btn secondary" id="addPhotoBtn" onclick="galleryInput.click()"></button><button class="btn secondary" id="takePhotoBtn" onclick="cameraInput.click()"></button></div><img id="photoPreview" class="photoPreview"><button id="removePhotoBtn" class="btn danger" style="display:none;margin-top:8px" onclick="removePhoto()"></button><div id="photoHint" class="muted small" style="margin-top:7px"></div>
<label class="caption" id="lblAvailable"></label><div id="equipmentChecks" class="chips"></div><div class="actions"><button id="generateBtn" class="btn primary" onclick="generatePlan()"></button><button id="resetBtn" class="btn secondary" onclick="resetPlanner()"></button></div></div><div id="planArea"></div></section>
<section id="projects" class="page"><h1 id="projectsTitle"></h1><div id="projectsList"></div><button class="fab" onclick="newProject()">+</button></section>
<section id="equipment" class="page"><h1 id="equipmentTitle"></h1><div class="card"><div class="row"><input id="eqName"><input id="eqQty" type="number" min="1" value="1"></div><div class="row" style="margin-top:8px"><select id="eqCategory"></select><button id="addEquipmentBtn" class="btn primary" onclick="addEquipment()"></button></div></div><div id="equipmentList"></div></section>
<section id="settings" class="page"><h1 id="settingsTitle"></h1><div class="card"><h2 id="aiTitle"></h2><p id="aiInfo" class="muted small"></p><label class="caption" id="backendLabel"></label><input id="backendUrl" readonly><div class="actions"><button id="testBtn" class="btn secondary" onclick="testBackend()"></button></div><div id="backendTest" style="margin-top:10px"></div></div><div class="card"><h2 id="dataTitle"></h2><p id="dataInfo" class="muted small"></p><div class="actions"><button id="exportBtn" class="btn secondary" onclick="exportData()"></button><button id="clearBtn" class="btn danger" onclick="clearAll()"></button></div></div><div class="card"><h2 id="aboutTitle"></h2><p class="muted small" id="aboutText"></p></div></section>
</main>
<nav><button class="active" data-page="planner"><span class="icon">✦</span><span id="navPlanner"></span></button><button data-page="projects"><span class="icon">▣</span><span id="navProjects"></span></button><button data-page="equipment"><span class="icon">▤</span><span id="navEquipment"></span></button><button data-page="settings"><span class="icon">⚙</span><span id="navSettings"></span></button></nav>
</div>
<script>
const PRODUCTION_BACKEND='https://lightingai.onrender.com';
const LS={equipment:'lighting_equipment_v1',projects:'lighting_projects_v1',settings:'lighting_settings_v1',lang:'lighting_language_v1'};
const DEFAULT_EQUIPMENT=[{id:'e1',name:'Aputure 600D',qty:1,category:'Light'},{id:'e2',name:'Aputure 300X',qty:1,category:'Light'},{id:'e3',name:'Astera Titan',qty:2,category:'Light'},{id:'e4',name:'4×4 Diffusion',qty:1,category:'Modifier'},{id:'e5',name:'4×4 Floppy',qty:1,category:'Control'},{id:'e6',name:'5-in-1 Reflector',qty:1,category:'Modifier'}];
const T={sr:{subtitle:'Gaffer Assistant • Filmska i studijska rasveta',planner:'Novi plan rasvete',projects:'Projekti',equipment:'Moja oprema',settings:'Podešavanja',project:'PROJEKAT',scene:'SCENA',type:'TIP',look:'IZGLED',space:'PROSTOR',camera:'KAMERA',description:'OPIS SCENE',photo:'FOTOGRAFIJA SCENE',addPhoto:'🖼 DODAJ SLIKU',takePhoto:'📷 SLIKAJ SCENU',removePhoto:'UKLONI SLIKU',photoHint:'Fotografija se koristi kao vizuelna referenca za AI plan rasvete.',available:'DOSTUPNA OPREMA',generate:'GENERIŠI PLAN',reset:'RESETUJ',projectPh:'Naziv projekta',scenePh:'Scena 01',descPh:'Opiši kadar, prozore, pozadinu, prirodno svetlo i željeni izgled...',types:['Film','Reklama','Intervju','Muzički video','Studio'],looks:['Prirodno','Filmski','Mračno','Visok kontrast','Meka reklama','Dan za noć'],cats:['Svetlo','Modifikator','Grip','Napajanje','Kontrola','Ostalo'],addEq:'DODAJ OPREMU',eqPh:'npr. Aputure 600D',qtyPh:'Količina',aiTitle:'AI servis',aiInfo:'LightingAI je povezan sa produkcionim AI servisom.',backend:'BACKEND URL',test:'TESTIRAJ VEZU',data:'Podaci',dataInfo:'Projekti i oprema čuvaju se lokalno na telefonu.',export:'IZVEZI JSON',clear:'OBRIŠI SVE',about:'O aplikaciji',aboutText:'LIGHTING AI • AI pomoćnik za planiranje filmske i studijske rasvete.',connected:'AI servis je podešen.',connecting:'Generišem AI plan...',serviceError:'AI servis trenutno nije dostupan. Pokušaj ponovo.',noProjects:'Nema sačuvanih projekata.',noEquipment:'Nema opreme.',delete:'OBRIŠI',saved:'Plan je sačuvan u Projektima.',confirmClear:'Obrisati sve lokalne projekte i opremu?',cleared:'Podaci su obrisani.',testOk:'Veza sa AI servisom radi.',testFail:'AI servis trenutno nije dostupan.'},en:{subtitle:'Gaffer Assistant • Film & Studio Lighting',planner:'New Lighting Plan',projects:'Projects',equipment:'My Equipment',settings:'Settings',project:'PROJECT',scene:'SCENE',type:'TYPE',look:'LOOK',space:'SPACE',camera:'CAMERA',description:'SCENE DESCRIPTION',photo:'SCENE PHOTO',addPhoto:'🖼 ADD IMAGE',takePhoto:'📷 CAPTURE SCENE',removePhoto:'REMOVE IMAGE',photoHint:'The photo is used as a visual reference for the AI lighting plan.',available:'AVAILABLE EQUIPMENT',generate:'GENERATE PLAN',reset:'RESET',projectPh:'Project name',scenePh:'Scene 01',descPh:'Describe the shot, windows, background, natural light and desired look...',types:['Film','Commercial','Interview','Music Video','Studio'],looks:['Natural','Cinematic','Moody','High Contrast','Soft Commercial','Day for Night'],cats:['Light','Modifier','Grip','Power','Control','Other'],addEq:'ADD EQUIPMENT',eqPh:'e.g. Aputure 600D',qtyPh:'Quantity',aiTitle:'AI service',aiInfo:'LightingAI is connected to the production AI service.',backend:'BACKEND URL',test:'TEST CONNECTION',data:'Data',dataInfo:'Projects and equipment are stored locally on this device.',export:'EXPORT JSON',clear:'CLEAR ALL',about:'About',aboutText:'LIGHTING AI • AI assistant for film and studio lighting planning.',connected:'AI service is configured.',connecting:'Generating AI plan...',serviceError:'AI service is currently unavailable. Please try again.',noProjects:'No saved projects.',noEquipment:'No equipment.',delete:'DELETE',saved:'Plan saved to Projects.',confirmClear:'Delete all local projects and equipment?',cleared:'Data cleared.',testOk:'AI service connection works.',testFail:'AI service is currently unavailable.'}};
function read(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}function write(k,v){localStorage.setItem(k,JSON.stringify(v))}
let equipment=read(LS.equipment,DEFAULT_EQUIPMENT),projects=read(LS.projects,[]),currentLang=localStorage.getItem(LS.lang)||'sr',scenePhoto='';
write(LS.settings,{backendUrl:PRODUCTION_BACKEND});
function el(id){return document.getElementById(id)}
function setOptions(id,items){const s=el(id),old=s.value;s.innerHTML=items.map(x=>`<option>${x}</option>`).join('');if(items.includes(old))s.value=old}
function setLanguage(lang){currentLang=lang;localStorage.setItem(LS.lang,lang);const t=T[lang];document.documentElement.lang=lang;['subtitle','plannerTitle','projectsTitle','equipmentTitle','settingsTitle'].forEach((id,i)=>el(id).textContent=[t.subtitle,t.planner,t.projects,t.equipment,t.settings][i]);el('lblProject').textContent=t.project;el('lblScene').textContent=t.scene;el('lblType').textContent=t.type;el('lblLook').textContent=t.look;el('lblSpace').textContent=t.space;el('lblCamera').textContent=t.camera;el('lblDescription').textContent=t.description;el('lblPhoto').textContent=t.photo;el('addPhotoBtn').textContent=t.addPhoto;el('takePhotoBtn').textContent=t.takePhoto;el('removePhotoBtn').textContent=t.removePhoto;el('photoHint').textContent=t.photoHint;el('lblAvailable').textContent=t.available;el('generateBtn').textContent=t.generate;el('resetBtn').textContent=t.reset;el('projectName').placeholder=t.projectPh;el('sceneName').placeholder=t.scenePh;el('description').placeholder=t.descPh;setOptions('type',t.types);setOptions('look',t.looks);setOptions('eqCategory',t.cats);el('eqName').placeholder=t.eqPh;el('eqQty').placeholder=t.qtyPh;el('addEquipmentBtn').textContent=t.addEq;el('aiTitle').textContent=t.aiTitle;el('aiInfo').textContent=t.aiInfo;el('backendLabel').textContent=t.backend;el('backendUrl').value=PRODUCTION_BACKEND;el('testBtn').textContent=t.test;el('dataTitle').textContent=t.data;el('dataInfo').textContent=t.dataInfo;el('exportBtn').textContent=t.export;el('clearBtn').textContent=t.clear;el('aboutTitle').textContent=t.about;el('aboutText').textContent=t.aboutText;el('navPlanner').textContent=lang==='sr'?'Planer':'Planner';el('navProjects').textContent=t.projects;el('navEquipment').textContent=lang==='sr'?'Oprema':'Equipment';el('navSettings').textContent=t.settings;el('langSr').classList.toggle('active',lang==='sr');el('langEn').classList.toggle('active',lang==='en');renderStatus();renderEquipment();renderProjects()}
function renderStatus(){el('apiStatus').innerHTML=`<div class="status ok">${T[currentLang].connected}</div>`}
function handlePhoto(e){const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{scenePhoto=r.result;el('photoPreview').src=scenePhoto;el('photoPreview').style.display='block';el('removePhotoBtn').style.display='block'};r.readAsDataURL(f)}
function removePhoto(){scenePhoto='';el('photoPreview').removeAttribute('src');el('photoPreview').style.display='none';el('removePhotoBtn').style.display='none';el('galleryInput').value='';el('cameraInput').value=''}
function selectedEquipment(){return [...document.querySelectorAll('#equipmentChecks input:checked')].map(x=>equipment.find(e=>e.id===x.value)).filter(Boolean)}
function renderEquipment(){const t=T[currentLang];el('equipmentChecks').innerHTML=equipment.map(e=>`<label class="chip"><input type="checkbox" value="${e.id}" checked><span>${escapeHtml(e.name)} × ${e.qty}</span></label>`).join('');el('equipmentList').innerHTML=equipment.length?equipment.map(e=>`<div class="card item"><div class="itemtop"><div><b>${escapeHtml(e.name)}</b><div class="muted small">${escapeHtml(e.category)} × ${e.qty}</div></div><button class="btn danger" onclick="deleteEquipment('${e.id}')">${t.delete}</button></div></div>`).join(''):`<div class="empty">${t.noEquipment}</div>`}
function addEquipment(){const n=el('eqName').value.trim();if(!n)return;equipment.push({id:'e'+Date.now(),name:n,qty:Math.max(1,Number(el('eqQty').value)||1),category:el('eqCategory').value});write(LS.equipment,equipment);el('eqName').value='';renderEquipment()}
function deleteEquipment(id){equipment=equipment.filter(e=>e.id!==id);write(LS.equipment,equipment);renderEquipment()}
function payload(){return{project:el('projectName').value,scene:el('sceneName').value,type:el('type').value,look:el('look').value,space:el('space').value,camera:el('camera').value,description:el('description').value,equipment:selectedEquipment(),language:currentLang,scenePhoto:scenePhoto||undefined}}
async function generatePlan(){const t=T[currentLang],p=payload();el('generateBtn').disabled=true;el('planArea').innerHTML=`<div class="status warn">${t.connecting}</div>`;try{const r=await fetch(PRODUCTION_BACKEND+'/api/lighting-plan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();const plan=data.plan||data.result||data;const text=typeof plan==='string'?plan:JSON.stringify(plan,null,2);const saved={id:'p'+Date.now(),createdAt:new Date().toISOString(),...p,scenePhoto:scenePhoto,plan:text};projects.unshift(saved);write(LS.projects,projects);renderProjects();el('planArea').innerHTML=`<div class="card"><h2 class="planTitle">${escapeHtml(p.project||t.planner)}</h2><div class="planText">${escapeHtml(text)}</div><p class="muted small">${t.saved}</p></div>`}catch(e){el('planArea').innerHTML=`<div class="status warn">${t.serviceError}</div>`}finally{el('generateBtn').disabled=false}}
function renderProjects(){const t=T[currentLang];el('projectsList').innerHTML=projects.length?projects.map(p=>`<div class="card"><b>${escapeHtml(p.project||'-')}</b><div class="muted small">${escapeHtml(p.scene||'')} • ${new Date(p.createdAt).toLocaleString()}</div><div class="planText small" style="margin-top:8px">${escapeHtml((p.plan||'').slice(0,500))}</div></div>`).join(''):`<div class="empty">${t.noProjects}</div>`}
function newProject(){showPage('planner');resetPlanner()}
function resetPlanner(){el('projectName').value='';el('sceneName').value='';el('description').value='';el('planArea').innerHTML='';removePhoto()}
async function testBackend(){const t=T[currentLang];try{const r=await fetch(PRODUCTION_BACKEND+'/api/fixtures');if(!r.ok)throw 0;el('backendTest').innerHTML=`<div class="status ok">${t.testOk}</div>`}catch(e){el('backendTest').innerHTML=`<div class="status warn">${t.testFail}</div>`}}
function exportData(){const text=JSON.stringify({projects,equipment},null,2);if(window.Android&&Android.saveText)Android.saveText('lighting-ai-export.json',text);else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download='lighting-ai-export.json';a.click()}}
function clearAll(){const t=T[currentLang];if(!confirm(t.confirmClear))return;projects=[];equipment=[...DEFAULT_EQUIPMENT];write(LS.projects,projects);write(LS.equipment,equipment);renderProjects();renderEquipment();alert(t.cleared)}
function showPage(id){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===id))}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>showPage(b.dataset.page));function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
setLanguage(currentLang);
</script>
</body></html>
