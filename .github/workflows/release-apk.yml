name: Build Signed Release APK

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Android versionCode (must increase for every update)
        required: true
        default: "14"
      version_name:
        description: Android versionName
        required: true
        default: "2.2"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Validate backend and catalog
        working-directory: backend
        run: npm run check

      - name: Validate Android WebView JavaScript syntax
        run: find app/src/main/assets -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate Project 5 safety
        working-directory: backend
        run: npm run test:project5-safety && npm run test:project5-base && npm run test:project52-release

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Require release signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.LIGHTINGAI_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.LIGHTINGAI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LIGHTINGAI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LIGHTINGAI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "Missing LIGHTINGAI_KEYSTORE_BASE64"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing LIGHTINGAI_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing LIGHTINGAI_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing LIGHTINGAI_KEY_PASSWORD"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/lightingai-release.jks"

      - name: Run Android unit tests
        run: gradle testDebugUnitTest

      - name: Build signed release APK
        env:
          LIGHTINGAI_KEYSTORE_PATH: ${{ runner.temp }}/lightingai-release.jks
          LIGHTINGAI_KEYSTORE_PASSWORD: ${{ secrets.LIGHTINGAI_KEYSTORE_PASSWORD }}
          LIGHTINGAI_KEY_ALIAS: ${{ secrets.LIGHTINGAI_KEY_ALIAS }}
          LIGHTINGAI_KEY_PASSWORD: ${{ secrets.LIGHTINGAI_KEY_PASSWORD }}
        run: |
          gradle assembleRelease             -PreleaseVersionCode=${{ inputs.version_code }}             -PreleaseVersionName=${{ inputs.version_name }}

      - name: Verify release APK
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          unzip -Z1 "$APK" | grep -Fxq 'assets/ai-visual-scene-plan.js'
          unzip -Z1 "$APK" | grep -Fxq 'assets/catalog.js'
          jarsigner -verify "$APK"
          cp "$APK" "app/build/outputs/apk/release/LightingAI-${{ inputs.version_name }}-${{ inputs.version_code }}.apk"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v7
        with:
          name: LightingAI-${{ inputs.version_name }}-${{ inputs.version_code }}.apk
          path: app/build/outputs/apk/release/LightingAI-${{ inputs.version_name }}-${{ inputs.version_code }}.apk
          archive: false
          retention-days: 30
