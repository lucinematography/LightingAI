plugins { id 'com.android.application' }

def releaseVersionCode = (project.findProperty('releaseVersionCode') ?: '13') as Integer
def releaseVersionName = String.valueOf(project.findProperty('releaseVersionName') ?: '2.1')
if (releaseVersionCode < 1 || releaseVersionCode > 2100000000) {
    throw new GradleException('versionCode must be between 1 and 2100000000')
}
def releaseStoreFile = System.getenv('LIGHTINGAI_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('LIGHTINGAI_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('LIGHTINGAI_KEY_ALIAS')
def releaseKeyPassword = System.getenv('LIGHTINGAI_KEY_PASSWORD')
def hasReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it != null && !it.trim().isEmpty() }

android { namespace 'com.lightingai.app'; compileSdk 35
    defaultConfig {
        applicationId 'com.lightingai.app'
        minSdk 26
        targetSdk 35
        versionCode releaseVersionCode
        versionName releaseVersionName
        testInstrumentationRunner 'com.lightingai.app.ScenePlannerRecoveryInstrumentation'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.review13'
            versionNameSuffix '-review13'
        }
        release {
            minifyEnabled false
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
        studio {
            initWith release
            applicationIdSuffix '.studio'
            debuggable false
            // The owner signs locally. CI must never receive the permanent private key.
            signingConfig = null
        }
    }
}


dependencies {
    testImplementation 'junit:junit:4.13.2'
}
