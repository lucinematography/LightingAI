plugins { id 'com.android.application' }

android { namespace 'com.lightingai.app'; compileSdk 35
    defaultConfig { applicationId 'com.lightingai.app'; minSdk 26; targetSdk 35; versionCode 15; versionName '2.3' }

    buildTypes {
        debug {
            applicationIdSuffix '.review13'
            versionNameSuffix '-review13'
        }
