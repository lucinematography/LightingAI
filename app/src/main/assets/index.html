<!doctype html>
<html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0f12"><title>LIGHTING AI</title><style>*{box-sizing:border-box}body{margin:0;background:#0d0f12;color:#f4f4f5;font-family:system-ui,sans-serif}.app{min-height:100vh;padding-bottom:84px}header{padding:16px;border-bottom:1px solid #23272d}.logo{font-weight:900}.logo span,.planTitle,.planSection h3{color:#f5c542}.sub,.muted{color:#9299a3}.langbar,.actions,.photoActions{display:flex;gap:8px;margin-top:10px}.langbtn,.btn{border:0;border-radius:10px;padding:10px;font-weight:700}.langbtn{background:#252a31;color:#fff}.langbtn.active,.primary{background:#f5c542;color:#111}.secondary{background:#252a31;color:#fff}.danger{background:#382124;color:#ffb5b5}main{max-width:800px;margin:auto;padding:14px}.page{display:none}.page.active{display:block}.card{background:#15181d;border:1px solid #282c32;border-radius:16px;padding:16px;margin-bottom:13px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.caption{display:block;color:#9da3ad;font-size:11px;margin:12px 0 6px}input,select,textarea{width:100%;background:#0f1115;border:1px solid #30343b;color:#fff;border-radius:11px;padding:12px}textarea{min-height:110px}.actions .btn,.photoActions .btn{flex:1}.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}.chip{padding:10px;background:#0f1115;border:1px solid #30343b;border-radius:11px;font-size:12px}.chip input{width:auto}.status{padding:10px;border-radius:11px;margin-bottom:12px;font-size:12px}.ok{background:#163025;color:#b8f0d1}.warn{background:#342e18;color:#f5dd91}.photoPreview{width:100%;max-height:320px;object-fit:cover;border-radius:12px;margin-top:10px;display:none}.planSection{padding:13px 0;border-bottom:1px solid #292d33}.planSection h3{margin:0 0 7px;font-size:14px}.planSection p{margin:0;line-height:1.55;white-space:pre-wrap}.planList{padding-left:20px}.small{font-size:12px}.empty{text-align:center;padding:30px;color:#858c95}nav{position:fixed;bottom:0;left:0;right:0;background:#111318;border-top:1px solid #25282d;display:grid;grid-template-columns:repeat(4,1fr);padding:7px}nav button{border:0;background:transparent;color:#858c95;padding:7px}nav button.active{color:#f5c542}@media(max-width:520px){.row{grid-template-columns:1fr}}</style></head><body><div class="app"><header><div class="logo">LIGHTING <span>AI</span></div><div class="sub" id="subtitle"></div><div class="langbar"><button id="langSr" class="langbtn" onclick="setLanguage('sr')">🇷🇸 SR</button><button id="langEn" class="langbtn" onclick="setLanguage('en')">🇬🇧 EN</button></div></header><main><section id="planner" class="page active"><h1 id="plannerTitle"></h1><div id="apiStatus"></div><div class="card"><div class="row"><div><label class="caption" id="lblProject"></label><input id="projectName"></div><div><label class="caption" id="lblScene"></label><input id="sceneName"></div></div><div class="row"><div><label class="caption" id="lblType"></label><select id="type"></select></div><div><label class="caption" id="lblLook"></label><select id="look"></select></div></div><div class="row"><div><label class="caption" id="lblSpace"></label><input id="space" value="6 × 5 × 3 m"></div><div><label class="caption" id="lblCamera"></label><input id="camera" value="ARRI Alexa 35"></div></div><label class="caption" id="lblDescription"></label><textarea id="description"></textarea><label class="caption" id="lblPhoto"></label><input id="galleryInput" type="file" accept="image/*" hidden onchange="handlePhoto(event)"><input id="cameraInput" type="file" accept="image/*" capture="environment" hidden onchange="handlePhoto(event)"><div class="photoActions"><button class="btn secondary" id="addPhotoBtn" onclick="galleryInput.click()"></button><button class="btn secondary" id="takePhotoBtn" onclick="cameraInput.click()"></button></div><img id="photoPreview" class="photoPreview"><button id="removePhotoBtn" class="btn danger" hidden onclick="removePhoto()"></button><div id="photoHint" class="muted small"></div><label class="caption" id="lblAvailable"></label><div id="equipmentChecks" class="chips"></div><div class="actions"><button id="generateBtn" class="btn primary" onclick="generatePlan()"></button><button id="resetBtn" class="btn secondary" onclick="resetPlanner()"></button></div></div><div id="planArea"></div></section><section id="projects" class="page"><h1 id="projectsTitle"></h1><div id="projectsList"></div></section><section id="equipment" class="page"><h1 id="equipmentTitle"></h1><div id="equipmentList"></div></section><section id="settings" class="page"><h1 id="settingsTitle"></h1><div class="card"><h2 id="aiTitle">AI servis</h2><p class="muted small" id="aiText"></p><input value="https://lightingai.onrender.com" readonly><div class="actions"><button id="testBtn" class="btn secondary" onclick="testBackend()"></button></div><div id="backendTest"></div></div><div class="card"><h2 id="dataTitle"></h2><p class="muted small" id="dataText"></p><div class="actions"><button id="exportBtn" class="btn secondary" onclick="exportData()"></button><button id="deleteBtn" class="btn danger" onclick="deleteAllData()"></button></div></div><div class="card"><h2 id="aboutTitle"></h2><p class="muted small" id="aboutText"></p></div></section></main><nav><button class="active" data-page="planner">✦ <span id="navPlanner"></span></button><button data-page="projects">▣ <span id="navProjects"></span></button><button data-page="equipment">▤ <span id="navEquipment"></span></button><button data-page="settings">⚙ <span id="navSettings"></span></button></nav></div><script>const B='https://lightingai.onrender.com',LS={equipment:'lighting_equipment_v1',projects:'lighting_projects_v1',lang:'lighting_language_v1'},DEF=[{id:'e1',name:'Aputure 600D',qty:1},{id:'e2',name:'Aputure 300X',qty:1},{id:'e3',name:'Astera Titan',qty:2},{id:'e4',name:'4×4 Diffusion',qty:1},{id:'e5',name:'4×4 Floppy',qty:1},{id:'e6',name:'5-in-1 Reflector',qty:1}];function read(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}function write(k,v){localStorage.setItem(k,JSON.stringify(v))}let equipment=read(LS.equipment,DEF),projects=read(LS.projects,[]),currentLang=localStorage.getItem(LS.lang)||'sr',scenePhoto='';const E=id=>document.getElementById(id),H=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const T={sr:{subtitle:'Gaffer Assistant • Filmska i studijska rasveta',planner:'Novi plan rasvete',projects:'Projekti',equipment:'Oprema',settings:'Podešavanja',project:'PROJEKAT',scene:'SCENA',type:'TIP',look:'IZGLED',space:'PROSTOR',camera:'KAMERA',description:'OPIS SCENE',photo:'FOTOGRAFIJA SCENE',add:'🖼 DODAJ SLIKU',take:'📷 SLIKAJ SCENU',remove:'UKLONI SLIKU',available:'DOSTUPNA OPREMA',generate:'GENERIŠI PLAN',reset:'RESETUJ',types:['Film','Reklama','Intervju','Muzički video','Studio'],looks:['Prirodno','Filmski','Mračno','Visok kontrast','Meka reklama','Dan za noć'],saved:'Plan je sačuvan u Projektima.',connecting:'Generišem AI plan...',error:'AI servis trenutno nije dostupan.'},en:{subtitle:'Gaffer Assistant • Film & Studio Lighting',planner:'New Lighting Plan',projects:'Projects',equipment:'Equipment',settings:'Settings',project:'PROJECT',scene:'SCENE',type:'TYPE',look:'LOOK',space:'SPACE',camera:'CAMERA',description:'SCENE DESCRIPTION',photo:'SCENE PHOTO',add:'🖼 ADD IMAGE',take:'📷 CAPTURE SCENE',remove:'REMOVE IMAGE',available:'AVAILABLE EQUIPMENT',generate:'GENERATE PLAN',reset:'RESET',types:['Film','Commercial','Interview','Music Video','Studio'],looks:['Natural','Cinematic','Moody','High Contrast','Soft Commercial','Day for Night'],saved:'Plan saved to Projects.',connecting:'Generating AI plan...',error:'AI service unavailable.'}};function opts(id,a){E(id).innerHTML=a.map(x=>`<option>${x}</option>`).join('')}function setLanguage(l){currentLang=l;localStorage.setItem(LS.lang,l);let t=T[l];E('subtitle').textContent=t.subtitle;E('plannerTitle').textContent=t.planner;E('projectsTitle').textContent=t.projects;E('equipmentTitle').textContent=t.equipment;E('settingsTitle').textContent=t.settings;['Project','Scene','Type','Look','Space','Camera','Description','Photo','Available'].forEach(x=>E('lbl'+x).textContent=t[x.toLowerCase()]);E('addPhotoBtn').textContent=t.add;E('takePhotoBtn').textContent=t.take;E('removePhotoBtn').textContent=t.remove;E('generateBtn').textContent=t.generate;E('resetBtn').textContent=t.reset;opts('type',t.types);opts('look',t.looks);E('navPlanner').textContent=l==='sr'?'Planer':'Planner';E('navProjects').textContent=t.projects;E('navEquipment').textContent=t.equipment;E('navSettings').textContent=t.settings;E('langSr').classList.toggle('active',l==='sr');E('langEn').classList.toggle('active',l==='en');E('apiStatus').innerHTML=`<div class="status ok">${l==='sr'?'AI servis je podešen.':'AI service is configured.'}</div>`;E('photoHint').textContent=l==='sr'?'Fotografija se koristi kao vizuelna referenca za AI plan rasvete.':'Photo is used as a visual reference.';E('aiText').textContent=l==='sr'?'LightingAI je povezan sa produkcionim AI servisom.':'LightingAI is connected to the production AI service.';E('testBtn').textContent=l==='sr'?'TESTIRAJ VEZU':'TEST CONNECTION';E('dataTitle').textContent=l==='sr'?'Podaci':'Data';E('dataText').textContent=l==='sr'?'Projekti i oprema čuvaju se lokalno na telefonu.':'Projects and equipment are stored locally on the phone.';E('exportBtn').textContent=l==='sr'?'IZVEZI JSON':'EXPORT JSON';E('deleteBtn').textContent=l==='sr'?'OBRIŠI SVE':'DELETE ALL';E('aboutTitle').textContent=l==='sr'?'O aplikaciji':'About';E('aboutText').textContent=l==='sr'?'LIGHTING AI • Gaffer Assistant za filmsku i studijsku rasvetu.':'LIGHTING AI • Gaffer Assistant for film and studio lighting.';renderEquipment();renderProjects()}function renderEquipment(){E('equipmentChecks').innerHTML=equipment.map(e=>`<label class="chip"><input type="checkbox" value="${e.id}" checked> ${H(e.name)} × ${e.qty}</label>`).join('');E('equipmentList').innerHTML=equipment.map(e=>`<div class="card"><b>${H(e.name)}</b> × ${e.qty}</div>`).join('')}function selected(){return[...document.querySelectorAll('#equipmentChecks input:checked')].map(x=>equipment.find(e=>e.id===x.value)).filter(Boolean)}function handlePhoto(ev){let f=ev.target.files?.[0];if(!f)return;let r=new FileReader;r.onload=()=>{scenePhoto=r.result;E('photoPreview').src=scenePhoto;E('photoPreview').style.display='block';E('removePhotoBtn').hidden=false};r.readAsDataURL(f)}function removePhoto(){scenePhoto='';E('photoPreview').style.display='none';E('removePhotoBtn').hidden=true}function parsePlan(v){if(v&&typeof v==='object'&&!Array.isArray(v)){if(v.plan!==undefined)v=v.plan;else if(v.result!==undefined)v=v.result}if(typeof v==='string'){let s=v.trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');try{return JSON.parse(s)}catch{return{summary:s}}}return v||{}}function labels(){return currentLang==='sr'?{summary:'Sažetak',key:'Glavno svetlo',fill:'Fill svetlo',backlight:'Kontra / pozadinsko svetlo',negative_fill:'Negativni fill',camera_notes:'Kamera',color_notes:'Boja',safety_notes:'Bezbednost',equipment_list:'Oprema u planu'}:{summary:'Summary',key:'Key light',fill:'Fill light',backlight:'Backlight',negative_fill:'Negative fill',camera_notes:'Camera',color_notes:'Color',safety_notes:'Safety',equipment_list:'Equipment'}}function value(v){if(Array.isArray(v))return`<ul class="planList">${v.map(x=>`<li>${H(typeof x==='object'?Object.values(x).join(' • '):x)}</li>`).join('')}</ul>`;return`<p>${H(typeof v==='object'?Object.values(v).join(' • '):v)}</p>`}function renderPlan(p,title){p=parsePlan(p);let L=labels(),order=['summary','key','fill','backlight','negative_fill','camera_notes','color_notes','safety_notes','equipment_list'],keys=[...order.filter(k=>p[k]!=null&&p[k]!==''),...Object.keys(p).filter(k=>!order.includes(k))];return`<div class="card"><h2 class="planTitle">${H(title)}</h2>${keys.map(k=>`<div class="planSection"><h3>${H(L[k]||k)}</h3>${value(p[k])}</div>`).join('')}<p class="muted small">${T[currentLang].saved}</p></div>`}async function generatePlan(){let t=T[currentLang],p={project:E('projectName').value,scene:E('sceneName').value,type:E('type').value,look:E('look').value,space:E('space').value,camera:E('camera').value,description:E('description').value,equipment:selected(),language:currentLang,scenePhoto:scenePhoto||undefined};E('planArea').innerHTML=`<div class="status warn">${t.connecting}</div>`;try{let r=await fetch(B+'/api/lighting-plan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});if(!r.ok)throw 0;let plan=parsePlan(await r.json());projects.unshift({id:'p'+Date.now(),createdAt:new Date().toISOString(),...p,plan});write(LS.projects,projects);renderProjects();E('planArea').innerHTML=renderPlan(plan,p.project||t.planner)}catch(e){E('planArea').innerHTML=`<div class="status warn">${t.error}</div>`}}function renderProjects(){E('projectsList').innerHTML=projects.length?projects.map(p=>`<div class="card"><b>${H(p.project||'-')}</b><div class="muted small">${H(p.scene||'')}</div></div>`).join(''):`<div class="empty">${currentLang==='sr'?'Nema sačuvanih projekata.':'No saved projects.'}</div>`}function resetPlanner(){E('projectName').value='';E('sceneName').value='';E('description').value='';E('planArea').innerHTML='';removePhoto()}async function testBackend(){try{let r=await fetch(B+'/api/fixtures');if(!r.ok)throw 0;E('backendTest').innerHTML=`<div class="status ok">${currentLang==='sr'?'Veza radi.':'Connection works.'}</div>`}catch{E('backendTest').innerHTML=`<div class="status warn">${currentLang==='sr'?'Veza nije dostupna.':'Connection unavailable.'}</div>`}}function exportData(){let text=JSON.stringify({projects,equipment},null,2),name='LightingAI-data.json';if(window.Android&&Android.saveText){Android.saveText(name,text)}else{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}}function deleteAllData(){let q=currentLang==='sr'?'Obrisati sve sačuvane projekte i vratiti početnu opremu?':'Delete all saved projects and restore default equipment?';if(!confirm(q))return;projects=[];equipment=DEF.map(x=>({...x}));write(LS.projects,projects);write(LS.equipment,equipment);renderProjects();renderEquipment();E('planArea').innerHTML=''}function showPage(id){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===id))}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>showPage(b.dataset.page));setLanguage(currentLang);</script></body></html>
