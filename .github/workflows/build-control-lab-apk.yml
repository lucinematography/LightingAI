name: Build Control Lab APK

on:
  workflow_dispatch:
    inputs:
      refresh_gels:
        description: Refresh the committed, verified official gel catalog
        type: boolean
        default: false
  push:
    branches: [ "feature/production-control-routing" ]

jobs:
  latest-head:
    runs-on: ubuntu-latest
    outputs:
      is_latest: ${{ steps.guard.outputs.is_latest }}
    steps:
      - name: Check current branch HEAD
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          LATEST="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          if [ -n "$LATEST" ] && [ "$GITHUB_SHA" = "$LATEST" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
            echo "Testing latest branch HEAD: $GITHUB_SHA"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale push $GITHUB_SHA; current HEAD is $LATEST"
          fi

  control-lab-build:
    needs: latest-head
    if: needs.latest-head.outputs.is_latest == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: lightingai-control-lab-${{ github.ref_name }}-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Audit backend dependencies
        working-directory: backend
        run: npm run audit:dependencies

      # The complete snapshot is committed and verified; ordinary builds do not
      # need four live vendor sites. Explicit refresh still uses npm run build:gels.
      - name: Refresh official FILTERI GEL catalog
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_gels
        working-directory: backend
        run: npm run build:gels

      - name: Verify cached or freshly built GEL catalog
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const sandbox={window:{}};
          vm.runInNewContext(fs.readFileSync('app/src/main/assets/gel-filter-catalog.js','utf8'),sandbox);
          const catalog=sandbox.window.LightingAIGelCatalog;
          const expected={'lee-lighting-filters':333,'rosco-supergel':144,'rosco-ecolour-plus':312,'rosco-cinegel':188};
          const got=Object.fromEntries((catalog?.sources||[]).map(s=>[s.key,s.count]));
          if(catalog?.sourceMode!=='official-build'||
             !Array.isArray(catalog?.filters)||catalog.filters.length!==977||
             Object.keys(got).length!==4||
             Object.entries(expected).some(([k,v])=>got[k]!==v)){
            throw new Error('No complete, verified official GEL snapshot available');
          }
          console.log('Validated 977 official GEL entries; snapshot date: '+catalog.generatedAt);
          NODE

      - name: Embed control-lab build identity
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          BUILT_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          printf 'window.LightingAIFeatureBuild={run:"%s",sha:"%s",branch:"%s",builtAt:"%s",lab:"control"};\n' "$GITHUB_RUN_NUMBER" "$SHORT_SHA" "$GITHUB_REF_NAME" "$BUILT_AT" > app/src/main/assets/feature-build-info.js

      - name: Validate complete equipment catalog
        working-directory: backend
        run: npm run check

      - name: Validate WebView JavaScript syntax
        run: find app/src/main/assets -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate Project 5 safety invariants
        working-directory: backend
        run: npm run test:project5-safety

      - name: Validate backup model
        run: node backend/project-backup-selftest.js

      - name: Validate full-app critical regression surface
        run: node backend/full-app-critical-selftest.js

      - name: Validate production control routing
        working-directory: backend
        run: node control-production-selftest.js

      - name: Validate Astera Control UI behavior
        run: node backend/astera-control-ui-selftest.js

      - name: Validate APK verification rejection paths
        run: node backend/control-apk-verifier-selftest.js

      - name: Validate operator desk safety
        working-directory: backend
        run: node control-operator-desk-selftest.js

      - name: Validate Astera btsnoop analyzer
        working-directory: backend
        run: node astera-btsnoop-analyzer-selftest.js

      - name: Validate Astera ATT differential analyzer
        working-directory: backend
        run: node astera-att-diff-selftest.js

      - name: Validate Astera ATT consensus analyzer
        working-directory: backend
        run: node astera-att-consensus-selftest.js

      - name: Validate Astera connect-only session consensus
        working-directory: backend
        run: node astera-att-session-consensus-selftest.js

      - name: Validate Astera verified session baseline filter
        working-directory: backend
        run: node astera-att-session-filter-selftest.js

      - name: Validate Astera physical capture-set orchestrator
        working-directory: backend
        run: node astera-physical-capture-set-selftest.js

      - name: Validate Astera ATT setpoint sweep analyzer
        working-directory: backend
        run: node astera-att-sweep-selftest.js

      - name: Audit full fixture control catalog
        working-directory: backend
        run: node control-catalog-audit.js

      - name: Validate control system driver families
        working-directory: backend
        run: node control-system-drivers-selftest.js

      - name: Verify control lab assets exist
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/assets/control-bootstrap.js
          test -s app/src/main/assets/control-routing.js
          test -s app/src/main/assets/control-dashboard.js
          test -s app/src/main/assets/control-system-drivers.js
          test -s app/src/main/assets/ble-control.js
          test -s app/src/main/java/com/lightingai/app/BleDeviceScanner.java
          test -s app/src/main/java/com/lightingai/app/BleGattInspector.java
          test -s app/src/main/java/com/lightingai/app/AsteraBtbBondManager.java
          test -s app/src/main/java/com/lightingai/app/AsteraBtbClassicInspector.java
          test -s app/src/main/java/com/lightingai/app/AsteraBtbCapturedFrames.java
          test -s app/src/main/java/com/lightingai/app/AsteraBtbColorReplayProbe.java
          grep -Fq "LightingAIControlBootstrapReady" app/src/main/assets/control-bootstrap.js
          grep -Fq "LightingAIControlBootstrapMode='bluetooth-only'" app/src/main/assets/control-bootstrap.js
          grep -Fq "ASTERA_BTB_PRIVATE_SERVICE='0a6c6c72-9ca6-ffaf-3440-b2dae8c86a65'" app/src/main/assets/ble-control.js
          grep -Fq "ASTERA_BTB_CAPTURE_WRITE='0a6c6c72-9ca6-ffaf-3440-b2dae8c86a66'" app/src/main/assets/ble-control.js
          if grep -Fq "artnet-control.js" app/src/main/assets/control-bootstrap.js || grep -Fq "dmx-patch-planner.js" app/src/main/assets/control-bootstrap.js || grep -Fq "dmx-export.js" app/src/main/assets/control-bootstrap.js; then
            echo "Primary CONTROL bootstrap must remain Bluetooth-only"
            exit 1
          fi
          echo "Bluetooth-only Control lab assets verified"

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Android lint (all errors block publication)
        run: gradle lintDebug

      - name: Enforce Android lint on changed app files
        working-directory: backend
        run: node android-lint-changed-files-gate.js

      - name: Android unit tests
        run: gradle testDebugUnitTest -PreleaseVersionCode=${{ 100000 + github.run_number }}

      - name: Build debug APK
        run: gradle assembleDebug -PreleaseVersionCode=${{ 100000 + github.run_number }}

      - name: Require persistent signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.LIGHTINGAI_KEYSTORE_BASE64 }}
          LIGHTINGAI_KEYSTORE_PASSWORD: ${{ secrets.LIGHTINGAI_KEYSTORE_PASSWORD }}
          LIGHTINGAI_KEY_ALIAS: ${{ secrets.LIGHTINGAI_KEY_ALIAS }}
          LIGHTINGAI_KEY_PASSWORD: ${{ secrets.LIGHTINGAI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in KEYSTORE_B64 LIGHTINGAI_KEYSTORE_PASSWORD LIGHTINGAI_KEY_ALIAS LIGHTINGAI_KEY_PASSWORD; do
            test -n "${!variable}" || { echo "::error::Missing persistent signing secret: $variable. No installable APK will be published."; exit 1; }
          done
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/lightingai-control.jks"
          CERT_SHA="$(keytool -exportcert -keystore "$RUNNER_TEMP/lightingai-control.jks" -alias "$LIGHTINGAI_KEY_ALIAS" -storepass:env LIGHTINGAI_KEYSTORE_PASSWORD | sha256sum | cut -d' ' -f1)"
          echo "CONTROL_CERT_SHA256=$CERT_SHA" >> "$GITHUB_ENV"

      - name: Build signed Control candidate
        env:
          LIGHTINGAI_KEYSTORE_PATH: ${{ runner.temp }}/lightingai-control.jks
          LIGHTINGAI_KEYSTORE_PASSWORD: ${{ secrets.LIGHTINGAI_KEYSTORE_PASSWORD }}
          LIGHTINGAI_KEY_ALIAS: ${{ secrets.LIGHTINGAI_KEY_ALIAS }}
          LIGHTINGAI_KEY_PASSWORD: ${{ secrets.LIGHTINGAI_KEY_PASSWORD }}
        run: |
          gradle assembleControl -PreleaseVersionCode=${{ 100000 + github.run_number }} -PreleaseVersionName=2.2
          gradle lintControl testControlUnitTest -PreleaseVersionCode=${{ 100000 + github.run_number }} -PreleaseVersionName=2.2

      - name: Verify signed APK identity, signature and packaged assets
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          export PATH="$BUILD_TOOLS:$PATH"
          node backend/control-apk-verifier.js app/build/outputs/apk/control/app-control.apk "${{ 100000 + github.run_number }}" "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "$CONTROL_CERT_SHA256"
          cp app/build/outputs/apk/control/app-control.apk "app/build/outputs/apk/control/LightingAI-Control-${GITHUB_RUN_NUMBER}.apk"

      - name: Upload signed test candidate (physical control unverified)
        uses: actions/upload-artifact@v7
        with:
          name: LightingAI-Control-${{ github.run_number }}.apk
          path: app/build/outputs/apk/control/LightingAI-Control-${{ github.run_number }}.apk
          archive: false
          retention-days: 30

      - name: Upload verification evidence
        uses: actions/upload-artifact@v7
        with:
          name: Control-verification-${{ github.run_number }}
          path: |
            app/build/outputs/apk/control/verification.json
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-control.html
            app/build/reports/tests/testControlUnitTest/
          retention-days: 30

      - name: Delete signing material from runner
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/lightingai-control.jks"
